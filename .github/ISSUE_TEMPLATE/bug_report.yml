name: Bug report
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem.
      render: php
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "package 0.1.0, Laravel 13.2, PHP 8.5.1"
    validations:
      required: true
