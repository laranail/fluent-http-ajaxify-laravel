name: Feature request
description: Something the package cannot do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that this package makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A sketch of the API is more useful than a description of it.
    validations:
      required: false
